<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fc" />
    <title>RVPay | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="background-shape background-shape--top" aria-hidden="true"></div>
      <div class="background-shape background-shape--bottom" aria-hidden="true"></div>

      <section class="login-panel recovery-panel" aria-labelledby="welcome-title">
        <a class="brand" href="index.html" aria-label="RVPay home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>RV<span class="brand-accent">Pay</span></span>
        </a>

        <div class="intro">
          <p class="eyebrow">Account recovery</p>
          <h1 id="welcome-title">Reset your password</h1>
          <p class="subtitle">You will receive password on your registered mobile, WhatsApp and email.</p>
        </div>

        <form id="recovery-form" class="login-form">
          <label class="field-label" for="recovery-contact">Registered mobile or email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.75h16v10.5H4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m4.5 7.5 7.5 5.25 7.5-5.25" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input id="recovery-contact" name="contact" type="text" placeholder="Enter mobile or email" autocomplete="email" required />
          </div>
          <button class="submit-button" type="submit">Reset <span aria-hidden="true">&rarr;</span></button>
          <p id="recovery-message" class="form-message" role="status"></p>
        </form>

        <p class="register-prompt"><a href="index.html" class="text-link">&larr; Back to Login</a></p>
      </section>
    </main>
    <script src="forgot-password.js"></script>
  </body>
</html>
