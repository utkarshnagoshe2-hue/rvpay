<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4f7fc" />
    <title>RVPay | Choose a New Password</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="background-shape background-shape--top" aria-hidden="true"></div>
      <div class="background-shape background-shape--bottom" aria-hidden="true"></div>
      <section class="login-panel recovery-panel" aria-labelledby="reset-title">
        <a class="brand" href="index.html" aria-label="RVPay home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>RV<span class="brand-accent">Pay</span></span>
        </a>
        <div class="intro">
          <p class="eyebrow">Account recovery</p>
          <h1 id="reset-title">Choose a new password</h1>
          <p class="subtitle">Use at least 8 characters. Your reset link can only be used once.</p>
        </div>
        <form id="reset-password-form" class="login-form">
          <label class="field-label" for="new-password">New password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
          </div>
          <label class="field-label" for="confirm-password">Confirm new password</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
          </div>
          <button class="submit-button" type="submit">Update password <span aria-hidden="true">&rarr;</span></button>
          <p id="reset-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
        <p class="register-prompt"><a href="index.html" class="text-link">Back to Login</a><span aria-hidden="true"> · </span><a href="forgot-password.html" class="text-link">Request a new reset link</a></p>
      </section>
    </main>
    <script src="api.js"></script>
    <script src="reset-password.js"></script>
  </body>
</html>
